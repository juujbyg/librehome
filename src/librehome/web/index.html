<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LibreHome</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🏠%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0e1621;--card:#17212f;--line:#263447;--fg:#e8eef6;--dim:#8a9bb0;--accent:#3ab8ff;--ok:#4ade80;--bad:#f87171}
@media (prefers-color-scheme:light){:root{--bg:#f2f5f9;--card:#fff;--line:#d9e0ea;--fg:#16202c;--dim:#5b6b80;--accent:#0a84d6;--ok:#16a34a;--bad:#dc2626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
header{max-width:900px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:20px;flex:1}
main{max-width:900px;margin:0 auto;padding:0 16px 32px}
#say{display:flex;gap:8px;margin-bottom:8px}
#say input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5}
#reply{min-height:1.4em;margin:0 0 16px;white-space:pre-line;color:var(--dim)}
#reply.err{color:var(--bad)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 2px;font-size:17px}
.kind{color:var(--dim);font-size:13px;margin-bottom:8px}
.status{font-weight:600}.status.running,.status.printing{color:var(--accent)}.status.off{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select,input[type=number]{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;width:100%}
label{font-size:13px;color:var(--dim);display:block;margin-top:6px}
.ink{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-top:4px}.ink span{width:110px}.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.ink.low i{background:var(--bad)}.warn{color:var(--bad)}
.empty{color:var(--dim);padding:24px;text-align:center}
</style>
</head>
<body>
<header><h1>🏠 LibreHome</h1><span id="conn" class="kind"></span></header>
<main>
  <form id="say"><input id="text" placeholder='Ask Jarvis: "start the dishwasher on eco"' autocomplete="off">
    <button type="button" id="mic" title="Speak">🎤</button><button class="primary">Go</button></form>
  <p id="reply"></p>
  <div id="grid"></div>
</main>
<script>
const qs = new URLSearchParams(location.search);
let token = qs.get('token') || (()=>{try{return localStorage.getItem('lh_token')}catch(e){return ''}})() || '';
if (qs.get('token')) { try{localStorage.setItem('lh_token', token)}catch(e){} history.replaceState(null,'',location.pathname); }
const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'X-Token': token, ...(opts.headers||{})}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
function say(msg, err) { $('reply').textContent = msg; $('reply').className = err ? 'err' : ''; }

function card(d) {
  const el = document.createElement('div'); el.className = 'card';
  const s = d.state || {};
  const status = !d.online ? 'offline' : s.error ? s.error : s.remaining_s ? `${s.program} · ${Math.ceil(s.remaining_s/60)} min left` : (s.status || 'ok');
  const cls = !d.online ? 'off' : (s.status || '');
  el.innerHTML = `<h2></h2><div class="kind"></div><div class="status ${cls}"></div>`;
  el.querySelector('h2').textContent = d.name;
  el.querySelector('.kind').textContent = d.kind.replace(/_/g, ' ');
  el.querySelector('.status').textContent = status;
  if (d.kind === 'printer') {
    for (const [ink, lvl] of Object.entries(s.ink || {})) {
      const r = document.createElement('div'); r.className = 'ink';
      r.innerHTML = '<span></span><div class="bar"><i></i></div>';
      r.querySelector('span').textContent = `${ink} ${lvl < 0 ? '?' : lvl + '%'}`;
      r.querySelector('i').style.width = Math.max(0, lvl) + '%';
      if (lvl >= 0 && lvl <= 10) r.classList.add('low');
      el.append(r);
    }
    for (const w of s.warnings || []) el.append(Object.assign(document.createElement('div'), {className:'kind warn', textContent: '⚠ ' + w.replace(/-/g, ' ')}));
    if ((s.queue||[]).length) el.append(Object.assign(document.createElement('div'), {className:'kind', textContent: `${s.queue.length} job(s) in queue`}));
  }
  const inputs = {};
  for (const a of d.actions) {
    if (a.name === 'service') continue;
    for (const [pn, spec] of Object.entries(a.params || {})) {
      if (inputs[pn]) continue;
      const lab = document.createElement('label'); lab.textContent = pn.replace(/_c$/, ' (°C)').replace(/_/g, ' ');
      let inp;
      if (spec.type === 'choice') { inp = document.createElement('select'); spec.choices.forEach(c => inp.add(new Option(c, c))); }
      else { inp = document.createElement('input'); inp.type = 'number'; if (spec.min) inp.min = spec.min; if (spec.max) inp.max = spec.max; inp.placeholder = spec.min ? `${spec.min}–${spec.max}` : ''; }
      inputs[pn] = inp; lab.append(inp); el.append(lab);
    }
  }
  const row = document.createElement('div'); row.className = 'row';
  for (const a of d.actions) {
    if (a.name === 'service') continue;
    const b = document.createElement('button'); b.textContent = a.name.replace('_', ' ');
    if (a.name === 'start') b.className = 'primary';
    b.onclick = async () => {
      const params = {};
      for (const pn of Object.keys(a.params || {})) if (inputs[pn] && inputs[pn].value !== '') params[pn] = inputs[pn].type === 'number' ? Number(inputs[pn].value) : inputs[pn].value;
      b.disabled = true;
      try { await api('/api/act/' + d.id + '/' + a.name, {method:'POST', body: JSON.stringify(params)}); say(`${d.name}: ${a.name} ok`); }
      catch (e) { say(e.message, true); }
      b.disabled = false; refresh();
    };
    row.append(b);
  }
  if (d.kind === 'printer') {
    const f = document.createElement('input'); f.type = 'file'; f.hidden = true;
    f.onchange = async () => {
      if (!f.files[0]) return;
      try { await api('/api/print/' + d.id + '?name=' + encodeURIComponent(f.files[0].name), {method:'POST', body: f.files[0]}); say(`Sent ${f.files[0].name} to ${d.name}`); }
      catch (e) { say(e.message, true); }
      f.value = ''; refresh();
    };
    const b = document.createElement('button'); b.className = 'primary'; b.textContent = 'print file…'; b.onclick = () => f.click();
    row.append(b, f);
  }
  el.append(row);
  return el;
}

let busy = false;
async function refresh() {
  if (busy || document.activeElement?.closest('.card')?.querySelector('select:focus,input:focus')) return;
  busy = true;
  try {
    const devs = await api('/api/devices');
    $('conn').textContent = ''; const g = $('grid'); g.replaceChildren(...devs.map(card));
    if (!devs.length) g.innerHTML = '<div class="empty">No devices yet. Edit the config file to add some.</div>';
  } catch (e) { $('conn').textContent = '⚠ ' + e.message; }
  busy = false;
}

$('say').onsubmit = async e => {
  e.preventDefault(); const text = $('text').value.trim(); if (!text) return;
  try { say((await api('/api/command', {method:'POST', body: JSON.stringify({text})})).reply); $('text').value = ''; }
  catch (err) { say(err.message, true); }
  refresh();
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  $('mic').onclick = () => { const r = new SR(); r.lang = 'en-US'; r.onresult = ev => { $('text').value = ev.results[0][0].transcript; $('say').requestSubmit(); }; r.onerror = ev => say('Voice: ' + ev.error, true); r.start(); };
} else $('mic').hidden = true;

refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
