name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: Start the hub and call its API
        shell: bash
        run: |
          export PYTHONPATH=src LIBREHOME_CONFIG="$RUNNER_TEMP/librehome.json"
          python -m librehome serve --no-browser --port 8484 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8484/api/devices && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:8484/api/command -d '{"text":"start the dishwasher on eco"}' | grep -q Started

  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clickable-ut
      - run: cd ubuntutouch && clickable build
      - uses: actions/upload-artifact@v4
        with:
          name: click
          path: ubuntutouch/build/all/app/*.click
          if-no-files-found: error
